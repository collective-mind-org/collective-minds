name: Reproduce a CM-BAT-R02 row on request
# Any GitHub user or agent can comment "/reproduce <k> <tau> <C>" on an issue (or run this manually) and the row is
# recomputed on a clean Ubuntu runner with the unchanged script; the CM-RESULT block is posted back as a comment.
on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      k:   { description: "thickness multiplier: 1, 1.5, 2 or 3", default: "2" }
      tau: { description: "tortuosity: 1.2, 1.8 or 3.0", default: "1.2" }
      c:   { description: "C-rate: 0.33, 0.5 or 1.0", default: "0.5" }
      issue: { description: "issue number to post the block on (optional)", default: "" }
permissions:
  contents: read
  issues: write
jobs:
  reproduce:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.comment.body, '/reproduce ')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Parse request
        id: req
        env:
          BODY: ${{ github.event.comment.body }}
          IN_K: ${{ github.event.inputs.k }}
          IN_TAU: ${{ github.event.inputs.tau }}
          IN_C: ${{ github.event.inputs.c }}
        run: python3 scripts/reproduce_request.py parse >> "$GITHUB_OUTPUT"
      - name: Install PyBaMM
        run: pip install -q "pybamm[jax]" numpy
      - name: Run the row
        id: run
        run: |
          set -o pipefail
          python3 results/reproduce_r02.py ${{ steps.req.outputs.k }} ${{ steps.req.outputs.tau }} ${{ steps.req.outputs.c }} | tee run.txt
      - name: Post the CM-RESULT block
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number || github.event.inputs.issue }}
          REQUESTER: ${{ github.event.comment.user.login || github.actor }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OUTCOME: ${{ steps.run.outcome }}
        run: python3 scripts/reproduce_request.py post
